baseURL = "https://bullish-intelligence.github.io/"
title = "Bullish Intelligence"
theme = ["github.com/Bullish-Design/roxo-flex", "siteman-default"]
locale = "en-us"
disableKinds = ["taxonomy", "term"]

layoutDir = ".siteman/layouts"
archetypeDir = ".siteman/archetypes"
themesDir = ".siteman/themes"
resourceDir = ".siteman/resources"
publishDir = "public"

[markup]
  [markup.highlight]
    noClasses = false

[module.hugoVersion]
extended = true
min = "0.162.1"

[params]
business_name = "Bullish Intelligence"
description = "AI, data science, and consumer goods product design."
logo = "/images/bullish-intelligence-horizontal.png"
footer_logo = "/images/bullish-intelligence-emblem.png"
favicon = "/favicon.png"
custom_css = "/css/brand.css"

[params.contact]
email = "bullishintelligenceai@gmail.com"

[params.style]
background = "#f5f7f9"
surface = "#e9eef2"
text = "#263037"
muted = "#556876"
accent = "#556876"
on_accent = "#ffffff"
border = "#cbd5dc"
font_body = "Arial, sans-serif"
font_heading = "Georgia, serif"
type_scale = "1.22"
spacing = "1.1rem"
button_radius = "0"
hero_image_radius = "0"
image_filter = "grayscale(1)"
icon_size = "1.15rem"

[[params.social]]
name = "GitHub"
url = "https://github.com/Bullish-Intelligence"

[[menu.main]]
name = "Home"
url = "/"
weight = 1

[[menu.main]]
name = "About"
url = "/about/"
weight = 2

[[menu.main]]
name = "Portfolio"
url = "/portfolio/"
weight = 3

[[menu.main]]
name = "Blog"
url = "/blog/"
weight = 4

[[menu.main]]
name = "Contact"
url = "/contact/"
weight = 5
