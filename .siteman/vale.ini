# Configuration for `siteman-check`'s prose-lint pass (vale).
# Docs: https://vale.sh/docs/
#
# StylesPath is resolved relative to THIS file, so "styles" means
# .siteman/styles/. The directory must exist (siteman-init creates it).
StylesPath = styles

# Only error-level alerts fail the check; warnings/suggestions are informational.
MinAlertLevel = error

[*.md]
# Uses only Vale's built-in "Vale" style, so the check runs fully offline — no
# `vale sync`, no network. To add richer prose rules (proselint, write-good,
# Microsoft, …), add a `Packages` line, run `vale sync` once, and list the styles
# here; the downloaded styles land under StylesPath.
BasedOnStyles = Vale

# Spelling needs a project vocabulary to avoid flagging names like "siteman" or
# "devenv"; off by default. Enable it and add accepted terms under StylesPath
# (Vale's accept.txt) when you want spell-checking.
Vale.Spelling = NO
