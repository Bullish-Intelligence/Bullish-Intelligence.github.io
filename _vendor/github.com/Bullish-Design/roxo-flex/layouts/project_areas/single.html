{{ define "main" }}<article class="section page-top"><div class="container narrow"><p><a class="text-link" href="{{ .Parent.RelPermalink }}">{{ .Parent.Title }}</a></p><h1>{{ .Title }}</h1>{{ with .Params.image }}<img class="feature-image" src="{{ . | relURL }}" alt="{{ $.Params.image_alt | default $.Title }}">{{ end }}<div class="prose">{{ .Content }}</div>{{ with .Params.project_images }}<div class="project-gallery">{{ range . }}<img src="{{ . | relURL }}" alt="{{ $.Title }} detail">{{ end }}</div>{{ end }}</div></article>{{ end }}
