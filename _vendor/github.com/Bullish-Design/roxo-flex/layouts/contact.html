{{ define "main" }}<section class="section page-top"><div class="container contact-grid"><div><h1>{{ .Title }}</h1><div class="prose">{{ .Content }}</div></div><div>{{ with site.Params.contact.form_endpoint }}<form action="{{ . | safeURL }}" method="post"><label for="name">Name</label><input id="name" name="name" required><label for="email">Email</label><input id="email" type="email" name="email" required><label for="message">Message</label><textarea id="message" name="message" rows="6" required></textarea><button class="button" type="submit">Send message</button></form>{{ else }}{{ with site.Params.contact.email }}<p>Email <a href="mailto:{{ . }}">{{ . }}</a> to start a conversation.</p>{{ end }}{{ end }}</div></div></section>{{ end }}
