<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Params.business_name | default site.Title }} home">
      {{ with site.Params.logo }}<img src="{{ . | relURL }}" alt="" width="44" height="44">{{ end }}
      <span>{{ site.Params.business_name | default site.Title }}</span>
    </a>
    <input class="nav-toggle" type="checkbox" id="nav-toggle" aria-label="Toggle navigation">
    <label class="nav-toggle-label{{ if site.Params.menu_close_icon }} has-close-icon{{ end }}" for="nav-toggle" aria-hidden="true">
      {{ with site.Params.menu_icon }}
        {{ partial "icon.html" (dict "src" . "class" "menu-icon") }}
      {{ else }}<span class="menu-line"></span><span class="menu-line"></span><span class="menu-line"></span>{{ end }}
      {{ with site.Params.menu_close_icon }}{{ partial "icon.html" (dict "src" . "class" "menu-close-icon") }}{{ end }}
    </label>
    <nav class="site-nav" aria-label="Main navigation">
      {{ range site.Menus.main }}<a href="{{ .URL | relURL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ with .Params.icon }}{{ partial "icon.html" (dict "src" . "class" "nav-icon") }}{{ end }}{{ .Name }}</a>{{ end }}
    </nav>
  </div>
</header>
